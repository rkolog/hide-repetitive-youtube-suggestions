<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Hide Repetitive Suggestions</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <h1>Hide Repetitive Suggestions</h1>
    <button id="enable" class="switch" role="switch" aria-checked="true" aria-label="Extension enabled">
      <span class="thumb"></span>
    </button>
  </header>

  <p id="stored" class="summary"></p>

  <fieldset id="panel">
    <section>
      <label for="value">Hide a video after it has appeared</label>
      <div class="row">
        <input id="value" type="number" min="1" step="1" inputmode="numeric">
        <span class="unit">times</span>
        <button id="save" class="btn primary">Save</button>
      </div>
    </section>

    <section>
      <div class="line">
        <span id="expireLabel" class="label">Show videos again after</span>
        <button id="expireOn" class="switch" role="switch" aria-checked="false" aria-labelledby="expireLabel">
          <span class="thumb"></span>
        </button>
      </div>
      <div class="row">
        <input id="expireDays" type="number" min="1" step="1" inputmode="numeric" aria-label="Number of days">
        <span class="unit">days</span>
        <button id="saveExpire" class="btn primary">Save</button>
      </div>
    </section>

    <section class="actions">
      <button id="toggle" class="btn" disabled>Show hidden</button>
      <button id="clear" class="btn">Clear history</button>
    </section>
  </fieldset>

  <p id="status" role="status" aria-live="polite"></p>

  <footer>
    Source:  <a href="https://github.com/rkolog/hide-repetitive-youtube-suggestions" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
